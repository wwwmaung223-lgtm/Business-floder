name: Frontend static checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [security/rls-permissions-hardening]

permissions:
  contents: read

jobs:
  frontend-static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript and security invariants
        run: python3 scripts/check_frontend.py
